
name: Alerte logements CROUS

on:
  workflow_dispatch:

jobs:
  test-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Envoyer un message Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          message = (
              "🏠 TEST ALERTE CROUS LILLE\n\n"
              "✅ Connexion GitHub → Telegram réussie !\n\n"
              "📍 Zone : Lille et environs\n"
              "💰 Budget maximum : 400 €/mois\n"
              "⏱️ Fréquence prévue : 5 minutes\n\n"
              "Ceci est un test, pas une annonce réelle."
          )

          data = json.dumps({
              "chat_id": chat_id,
              "text": message
          }).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.load(response)
              if not result.get("ok"):
                  raise RuntimeError("Telegram a refusé le message")

          print("Message Telegram envoyé avec succès !")
          PY
